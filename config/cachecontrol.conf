# Интервал, обозначающий раз во сколько секунд будет
# обновляться информация и подгружаться файлы 
interval=10

# Формат записи:
# <путь_с_маской> <политика> [параметры]

# Допустимые политики:
# KEEP - постоянно поддерживает файл в кэше
# EVICT - выгружает файл, если им не пользуются age секунд
# MONITOR - собирает статистику о файле, не подгружает его

# Пример записи:
/home/wild4est/GitProjects/TestFileMonitoring2/test_files/evict_file evict age=60
/home/wild4est/GitProjects/TestFileMonitoring2/test_files/keep_file keep 
/home/wild4est/GitProjects/TestFileMonitoring2/test_files/monitor_file monitor 
#/home/wild4est/GitProjects/TestFileMonitoring2/test_files/shrek.txt keep
